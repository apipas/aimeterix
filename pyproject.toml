[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-meterix"
version = "0.1.0"
description = "Know what your AI compute costs, what you waste, and what next month will cost."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Maher Abuthraa" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/apipas-com/aimeterix"
Issues = "https://github.com/apipas-com/aimeterix/issues"
Changelog = "https://github.com/apipas-com/aimeterix/blob/main/CHANGELOG.md"

[project.scripts]
aimeterix = "ai_meterix.interfaces.cli:main"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
duckdb = ["duckdb>=1.0"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.5",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_meterix"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["ai_meterix"]
warn_unused_ignores = true
# Plain-file cache: sandboxed assistants may be denied *.db files, and it is just as fast.
sqlite_cache = false
warn_redundant_casts = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "ai_meterix.core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
