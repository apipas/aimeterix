# AI Meterix configuration. Safe to commit: keep secrets out of this file.
# Any value can be overridden with an environment variable named
# AIMETERIX_<SECTION>_<FIELD>, e.g. AIMETERIX_STORAGE_URL.

storage:
  # sqlite (default), postgresql or duckdb. For a database with a password,
  # set AIMETERIX_STORAGE_URL in the environment or a .env file instead.
  url: sqlite:///~/.aimeterix/meter.db
  raw_retention_days: 30       # raw samples and calls
  rollup_retention_days: 365   # hourly rollups
  busy_timeout_ms: 5000        # SQLite wait when another process is writing

agent:
  interval_s: 10               # 1 to 300 seconds

proxy:
  host: 127.0.0.1              # localhost only (record 0017)
  port: 8787
  # Route name -> provider base URL. Clients use http://127.0.0.1:8787/<route>/v1
  upstreams:
    openai: https://api.openai.com
    anthropic: https://api.anthropic.com
  # Paths without a route name go here, e.g. a local llama.cpp or Ollama server.
  # default_upstream: http://127.0.0.1:8080
  # SHA-256 hashes of the API keys the proxy may forward (aimeterix proxy --hash-key).
  # Empty means any key. Never put the keys themselves here.
  allowed_key_hashes: []

api:
  host: 127.0.0.1
  port: 8788
